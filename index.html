<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terrex en Movimiento | BogotaFitDeals</title>

  <!-- Componente model-viewer de Google (Actualizado a 4.1.0 para evitar errores) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>

  <!-- Tipografía Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0b0d0f;
      --card-bg: #15181c;
      --accent-red: #ff2a2a;
      --accent-orange: #ff5500;
      --text-white: #ffffff;
      --text-gray: #a0a5ad;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    header {
      width: 100%;
      max-width: 600px;
      padding: 20px;
      text-align: center;
    }

    .brand-tag {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--text-gray);
      text-transform: uppercase;
    }

    .terrex-text {
      font-size: 42px;
      font-style: italic;
      font-weight: 900;
      color: var(--accent-red);
      line-height: 0.9;
    }

    .movimiento-text {
      font-size: 32px;
      font-weight: 900;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--accent-red), var(--accent-orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .ar-container {
      width: 100%;
      max-width: 600px;
      height: 400px;
      position: relative;
      background: radial-gradient(circle, rgba(30,35,42,1) 0%, rgba(11,13,15,1) 100%);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    model-viewer {
      width: 100%;
      height: 100%;
    }

    .ar-button {
      background: linear-gradient(90deg, var(--accent-red), var(--accent-orange));
      color: var(--text-white);
      border: none;
      border-radius: 30px;
      padding: 12px 24px;
      font-weight: 700;
      font-size: 14px;
      text-transform: uppercase;
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      cursor: pointer;
    }

    .content-box {
      width: 90%;
      max-width: 600px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    h2 {
      font-size: 18px;
      text-transform: uppercase;
      color: var(--accent-red);
      margin-bottom: 12px;
    }

    p {
      font-size: 14px;
      color: var(--text-gray);
      line-height: 1.5;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      font-weight: 900;
      text-transform: uppercase;
      font-size: 16px;
      margin-top: 12px;
      box-sizing: border-box;
    }

    .btn-360 {
      background: linear-gradient(90deg, #1e252a, #2a323d);
      color: #fff;
      border: 1px solid var(--accent-orange);
      box-shadow: 0 4px 15px rgba(255, 85, 0, 0.2);
    }

    .btn-buy {
      background: linear-gradient(90deg, var(--accent-red), var(--accent-orange));
      color: white;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-tag">BogotaFitDeals presenta</div>
    <div class="terrex-text">terrex</div>
    <div class="movimiento-text">EN MOVIMIENTO</div>
  </header>

  <!-- Visor 3D con model-viewer CORREGIDO -->
  <div class="ar-container">
    <model-viewer 
      src="adidas-terrex.glb" 
      alt="adidas Terrex Anylander 3D" 
      ar 
      ar-modes="webxr scene-viewer quick-look" 
      camera-controls 
      auto-rotate>
      <button slot="ar-button" class="ar-button">📷 Ver en mi espacio</button>
    </model-viewer>
  </div>

  <!-- Sección Experiencia WebAR (Enlace a MyWebAR) -->
  <div class="content-box" style="text-align: center; border: 1px solid rgba(255, 85, 0, 0.4);">
    <h2>🔄 Experiencia Web 360° (MyWebAR)</h2>
    <p>Explora la experiencia inmersiva e interactiva directamente en la plataforma de MyWebAR.</p>
    
    <a href="https://mywebar.com/p/Project_3_h4ol7sn8jq" target="_blank" rel="noopener noreferrer" class="btn btn-360">
      Abrir Experiencia en MyWebAR
    </a>
  </div>

  <!-- Oferta y Botón de Compra -->
  <div class="content-box" style="text-align: center;">
    <h2>⚡ Oferta de Lanzamiento ⚡</h2>
    <p>Adquiere tus tenis con un 20% OFF de descuento.</p>
    <a href="https://a.co/d/09DaffkK" target="_blank" rel="noopener noreferrer" class="btn btn-buy">
      ¡Comprar Ahora!
    </a>
  </div>

</body>
</html>
